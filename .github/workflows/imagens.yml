name: Imagens

# Publica as imagens de produção no GitHub Container Registry. Só roda à mão
# (Actions > Imagens > Run workflow) ou ao criar uma tag v*: nada é publicado
# a cada merge. As máquinas de produção sobem a tag que está em VERSAO.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Tag do git a publicar (ex.: v0.8.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    name: imagem ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nome: api
            contexto: .
            arquivo: apps/api/Dockerfile
          - nome: painel
            contexto: .
            arquivo: apps/admin/Dockerfile
          - nome: worker
            contexto: services/ingest
            arquivo: services/ingest/Dockerfile
          - nome: postgres
            contexto: infra/postgres
            arquivo: infra/postgres/Dockerfile
    env:
      VERSAO: ${{ inputs.versao || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSAO }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.arquivo }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vida-publica-${{ matrix.nome }}:${{ env.VERSAO }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSAO }}
            org.opencontainers.image.licenses=AGPL-3.0-only
