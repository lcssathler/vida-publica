name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varredura de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra:
    name: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gera infra/.env com senhas aleatórias
        run: node infra/scripts/init-env.mjs
      - name: Valida o docker-compose
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Sobe banco e armazenamento e espera ficarem saudáveis
        # O teste de restauração roda no passo próprio, não no laço do backup.
        run: VP_BACKUP_TESTE_DIAS=0 docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180
      - name: Aplica as migrações do banco
        run: docker compose -f infra/docker-compose.yml run --rm migrate
      - name: API responde no compose
        run: curl -fsS http://localhost:3000/health
      - name: API do admin e painel de revisão respondem no compose
        run: |
          curl -fsS http://127.0.0.1:3001/health
          curl -fsS http://127.0.0.1:3002/saude
          # Sem sessão do painel: 401 na API do admin e o painel manda ao login.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/admin/resumo)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/)" = 307
      - name: Notificador roda um ciclo com o usuário vp_notify
        run: |
          docker compose -f infra/docker-compose.yml run --rm notificador node dist/notificacoes/notificador.js ciclo
          # O contínuo para aqui: os testes de integração controlam o relógio da fila.
          docker compose -f infra/docker-compose.yml stop notificador
      - name: Worker acessa o armazenamento
        run: |
          docker compose -f infra/docker-compose.yml run --rm worker check-storage
          docker compose -f infra/docker-compose.yml run --rm worker check-db
      - name: Vigia confere os prazos das fontes (no banco vazio, todas atrasadas e com alerta)
        run: |
          docker compose -f infra/docker-compose.yml run --rm worker vigiar
          docker compose -f infra/docker-compose.yml exec -T postgres psql -U vp_owner -d vida_publica -tAc             "SELECT count(*) FROM raw.alerta WHERE resolvido_em IS NULL" | grep -qv '^0$'
      - name: Backup contínuo e teste de restauração (pgBackRest)
        run: |
          # O laço do serviço backup faz o primeiro backup completo sozinho.
          for i in $(seq 1 60); do
            docker compose -f infra/docker-compose.yml exec -T backup vp-backup info | grep -q "full backup" && break
            sleep 5
          done
          docker compose -f infra/docker-compose.yml exec -T backup vp-backup info
          docker compose -f infra/docker-compose.yml exec -T backup vp-backup testar-restauracao
      - uses: astral-sh/setup-uv@v5
      - name: Testes de integração (esquema e permissões)
        working-directory: services/ingest
        run: |
          set -a; . ../../infra/.env; set +a
          uv sync --frozen
          uv run pytest -m integration
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Testes de integração da API (adaptadores Postgres)
        run: |
          set -a; . infra/.env; set +a
          pnpm install --frozen-lockfile --filter @vida-publica/api...
          export VP_API_TEST_DATABASE_URL="postgres://vp_api:${VP_API_DB_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}"
          export VP_NOTIFY_TEST_DATABASE_URL="postgres://vp_notify:${VP_NOTIFY_DB_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}"
          export VP_ADMIN_TEST_DATABASE_URL="postgres://vp_admin:${VP_ADMIN_DB_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}"
          export VP_API_TEST_OWNER_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}"
          pnpm --filter @vida-publica/api run test:int
      - name: Derruba o ambiente
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Formatação
        run: terraform fmt -check -recursive
      - name: Validação
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Plano sem conta (credenciais fictícias, nenhuma chamada à AWS)
        env:
          AWS_ACCESS_KEY_ID: ficticio
          AWS_SECRET_ACCESS_KEY: ficticio
        run: terraform plan -input=false -lock=false -var-file=exemplo.tfvars -var planejar_sem_conta=true
      - name: Scripts de produção e de backup (shellcheck)
        working-directory: .
        run: shellcheck infra/producao/subir.sh && shellcheck -s sh infra/postgres/vp-backup

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detecta workspace Node
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instala dependências
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm -r --if-present lint
      - name: Tipos
        if: steps.detect.outputs.present == 'true'
        run: pnpm -r --if-present typecheck
      - name: Testes
        if: steps.detect.outputs.present == 'true'
        run: pnpm -r --if-present test
      - name: Empacota o app mobile (Metro)
        if: steps.detect.outputs.present == 'true' && hashFiles('apps/mobile/package.json') != ''
        working-directory: apps/mobile
        run: CI=1 pnpm exec expo export --platform android --output-dir /tmp/expo-export
      - name: Build da imagem da API
        if: steps.detect.outputs.present == 'true' && hashFiles('apps/api/Dockerfile') != ''
        run: docker build -f apps/api/Dockerfile -t vida-publica-api:ci .
      - name: Build do painel de revisão (Next.js)
        if: steps.detect.outputs.present == 'true' && hashFiles('apps/admin/package.json') != ''
        run: pnpm --filter @vida-publica/admin run build
      - name: Sem workspace Node ainda
        if: steps.detect.outputs.present != 'true'
        run: echo "Nenhum pnpm-lock.yaml encontrado; nada a verificar."

  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - name: Detecta projeto Python
        id: detect
        working-directory: .
        run: |
          if [ -f services/ingest/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v5
        if: steps.detect.outputs.present == 'true'
      - name: Instala dependências
        if: steps.detect.outputs.present == 'true'
        run: uv sync --frozen
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes
        if: steps.detect.outputs.present == 'true'
        run: uv run pytest
      - name: Build da imagem do worker
        if: steps.detect.outputs.present == 'true'
        run: docker build -t vida-publica-ingest:ci .
      - name: Sem projeto Python ainda
        if: steps.detect.outputs.present != 'true'
        working-directory: .
        run: echo "Nenhum services/ingest/pyproject.toml encontrado; nada a verificar."
