# Ambiente local. Nenhuma senha fica neste arquivo: elas vêm de infra/.env,
# gerado por `node infra/scripts/init-env.mjs` (o .env nunca é versionado).
name: vida-publica

# Repositório do backup (pgBackRest), igual para o banco (arquivamento de WAL)
# e para o serviço de backup. Tudo por variável: nenhuma credencial em arquivo.
# No ambiente local o repositório é o RustFS, atrás do proxy TLS backup-s3 (o
# pgBackRest só fala S3 por HTTPS); em produção, um S3 de outro provedor.
x-pgbackrest: &pgbackrest
  PGBACKREST_STANZA: vida-publica
  PGBACKREST_PG1_PATH: /var/lib/postgresql/data
  PGBACKREST_PG1_SOCKET_PATH: /var/run/postgresql
  PGBACKREST_PG1_USER: ${POSTGRES_USER:-vp_owner}
  PGBACKREST_REPO1_TYPE: s3
  PGBACKREST_REPO1_S3_ENDPOINT: ${VP_BACKUP_S3_ENDPOINT:-backup-s3}
  PGBACKREST_REPO1_STORAGE_PORT: ${VP_BACKUP_S3_PORTA:-9443}
  # Local: certificado da CA interna do proxy; em produção, sempre y.
  PGBACKREST_REPO1_STORAGE_VERIFY_TLS: ${VP_BACKUP_S3_VERIFICAR_TLS:-n}
  PGBACKREST_REPO1_S3_BUCKET: ${VP_BACKUP_S3_BUCKET:-vp-backup}
  PGBACKREST_REPO1_S3_REGION: ${VP_BACKUP_S3_REGIAO:-us-east-1}
  PGBACKREST_REPO1_S3_KEY: ${VP_BACKUP_S3_CHAVE:-${S3_ACCESS_KEY:-vp_s3}}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${VP_BACKUP_S3_SEGREDO:-${S3_SECRET_KEY:?rode node infra/scripts/init-env.mjs}}
  PGBACKREST_REPO1_S3_URI_STYLE: path
  PGBACKREST_REPO1_PATH: /vida-publica
  # Tudo cifrado no repositório (AES-256); sem a frase, o backup não abre.
  PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
  PGBACKREST_REPO1_CIPHER_PASS: ${VP_BACKUP_CIFRA:?rode node infra/scripts/init-env.mjs}
  PGBACKREST_REPO1_RETENTION_FULL: "2"
  PGBACKREST_COMPRESS_TYPE: zst
  PGBACKREST_START_FAST: "y"
  PGBACKREST_LOG_LEVEL_CONSOLE: warn
  PGBACKREST_LOG_LEVEL_FILE: "off"

services:
  postgres:
    build:
      context: ./postgres
    image: vida-publica-postgres
    restart: unless-stopped
    # Backup contínuo: cada segmento de WAL vai para o repositório (no máximo
    # 5 minutos de atraso, archive_timeout), o que permite restaurar em
    # qualquer ponto no tempo desde o backup completo mais antigo guardado.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest archive-push %p
      - -c
      - archive_timeout=300
    environment:
      <<: *pgbackrest
      POSTGRES_DB: ${POSTGRES_DB:-vida_publica}
      POSTGRES_USER: ${POSTGRES_USER:-vp_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode node infra/scripts/init-env.mjs}
      VP_INGEST_DB_PASSWORD: ${VP_INGEST_DB_PASSWORD:?rode node infra/scripts/init-env.mjs}
      VP_API_DB_PASSWORD: ${VP_API_DB_PASSWORD:?rode node infra/scripts/init-env.mjs}
      VP_ADMIN_DB_PASSWORD: ${VP_ADMIN_DB_PASSWORD:?rode node infra/scripts/init-env.mjs}
      VP_NOTIFY_DB_PASSWORD: ${VP_NOTIFY_DB_PASSWORD:?rode node infra/scripts/init-env.mjs}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Armazenamento compatível com S3 (RustFS, Apache-2.0). Em produção, qualquer
  # serviço S3 serve: a aplicação só fala com a API S3.
  s3:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-vp_s3}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?rode node infra/scripts/init-env.mjs}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://vp_api:${VP_API_DB_PASSWORD:?rode node infra/scripts/init-env.mjs}@postgres:5432/${POSTGRES_DB:-vida_publica}
      JWT_SECRET: ${VP_API_JWT_SECRET:?rode node infra/scripts/init-env.mjs}
      APPLE_CLIENT_IDS: ${VP_APPLE_CLIENT_IDS:-}
      GOOGLE_CLIENT_IDS: ${VP_GOOGLE_CLIENT_IDS:-}
      CORS_ORIGENS: ${VP_API_CORS_ORIGENS:-}
      # Observabilidade (opcional; vazio desliga): erros e traces no Sentry.
      SENTRY_DSN: ${VP_SENTRY_DSN:-}
      SENTRY_AMBIENTE: ${VP_AMBIENTE:-local}
      VP_SERVICO: api
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Notificador: lê os eventos recém-publicados, monta a fila de avisos de quem
  # segue cada alvo e envia (teto diário e horário de silêncio de cada conta).
  # Mesma imagem da API, outro processo e outro usuário do banco (vp_notify).
  # Com a conta de serviço do Firebase (VP_FCM_CREDENCIAIS_JSON no infra/.env),
  # envia pelo FCM; sem ela, usa o adaptador falso, que só registra os envios.
  # Uma rodada só: docker compose -f infra/docker-compose.yml run --rm notificador ciclo
  notificador:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/notificacoes/notificador.js", "continuo"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://vp_notify:${VP_NOTIFY_DB_PASSWORD:?rode node infra/scripts/init-env.mjs}@postgres:5432/${POSTGRES_DB:-vida_publica}
      # Conta de serviço do Firebase (JSON numa linha, só no infra/.env). Vazia: adaptador falso.
      FCM_CREDENCIAIS_JSON: ${VP_FCM_CREDENCIAIS_JSON:-}
      FCM_VALIDAR_APENAS: ${VP_FCM_VALIDAR_APENAS:-false}
      SENTRY_DSN: ${VP_SENTRY_DSN:-}
      SENTRY_AMBIENTE: ${VP_AMBIENTE:-local}
      VP_SERVICO: notificador
      # Sinal de vida no healthchecks.io (check "notificador"); vazio desliga.
      HEALTHCHECKS_PING_KEY: ${VP_HEALTHCHECKS_PING_KEY:-}
    # Saudável enquanto o laço do modo contínuo roda (sinal de vida a cada ciclo).
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/notificador-vivo -mmin -5 2>/dev/null)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # API do painel de revisão: mesma imagem da API, só as rotas /admin, com o
  # usuário vp_admin. Fica só em 127.0.0.1: o único cliente é o painel Next.js
  # (apps/admin), que repassa o IP de quem acessa (conferido em ADMIN_IPS).
  # Contas do painel (sem cadastro pela web):
  #   docker compose -f infra/docker-compose.yml exec admin-api node dist/admin/admin-cli.js criar <email> <nome>
  admin-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/admin/admin.js"]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://vp_admin:${VP_ADMIN_DB_PASSWORD:?rode node infra/scripts/init-env.mjs}@postgres:5432/${POSTGRES_DB:-vida_publica}
      ADMIN_TOTP_CHAVE: ${VP_ADMIN_TOTP_CHAVE:?rode node infra/scripts/init-env.mjs}
      ADMIN_IPS: ${VP_ADMIN_IPS:-127.0.0.1,::1,172.16.0.0/12}
      # O painel é o proxy à frente: o IP de quem acessa vem no X-Forwarded-For.
      TRUST_PROXY: 1
      SENTRY_DSN: ${VP_SENTRY_DSN:-}
      SENTRY_AMBIENTE: ${VP_AMBIENTE:-local}
      VP_SERVICO: admin-api
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Painel de revisão (Next.js, apps/admin): http://127.0.0.1:3002, só desta
  # máquina. Login com e-mail, senha e código do 2FA (contas criadas pelo
  # admin-cli acima). No compose, quem abre pela porta publicada chega pela
  # rede do Docker (172.16.0.0/12); em produção, ADMIN_IPS lista os IPs da
  # equipe e o proxy reverso fica à frente.
  painel:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_API_URL: http://admin-api:3000
      ADMIN_IPS: ${VP_ADMIN_IPS:-127.0.0.1,::1,172.16.0.0/12}
      # HTTP só na máquina local; em produção o cookie exige HTTPS.
      PAINEL_HTTP: "1"
    ports:
      - "127.0.0.1:${PAINEL_PORT:-3002}:3002"
    depends_on:
      admin-api:
        condition: service_started

  # Só no ambiente local: TLS na frente do RustFS para o repositório do backup
  # (o pgBackRest não fala S3 sem HTTPS). Certificado da CA interna do Caddy.
  backup-s3:
    image: caddy:2.10-alpine
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "https://backup-s3:9443", "--to", "http://s3:9000", "--internal-certs"]
    depends_on:
      s3:
        condition: service_healthy

  # Backup: mesma imagem do banco, com o diretório de dados só para leitura e o
  # socket compartilhado. A cada hora confere o arquivamento de WAL e faz o
  # backup completo (semanal) ou diferencial (diário); a cada 30 dias, o teste
  # de restauração num banco descartável. Registra tudo em raw.job_run (o vigia
  # alerta se parar) e, com a chave, pinga o check "backup" do healthchecks.io.
  #   docker compose -f infra/docker-compose.yml exec backup vp-backup testar-restauracao
  backup:
    image: vida-publica-postgres
    restart: unless-stopped
    command: ["vp-backup", "agendar"]
    shm_size: 256mb
    environment:
      <<: *pgbackrest
      POSTGRES_USER: ${POSTGRES_USER:-vp_owner}
      POSTGRES_DB: ${POSTGRES_DB:-vida_publica}
      VP_BACKUP_CRIAR_BUCKET_URL: ${VP_BACKUP_CRIAR_BUCKET_URL:-http://s3:9000}
      VP_BACKUP_TESTE_DIAS: ${VP_BACKUP_TESTE_DIAS:-30}
      VP_HEALTHCHECKS_PING_KEY: ${VP_HEALTHCHECKS_PING_KEY:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - postgres-socket:/var/run/postgresql
      - postgres-restauracao:/restauracao
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/backup-vivo -mmin -90 2>/dev/null)\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      backup-s3:
        condition: service_started

  # Restauração do banco de verdade (com o postgres parado): sem argumentos, até
  # o último WAL arquivado; com --type=time --target="<instante>", até o instante.
  #   docker compose -f infra/docker-compose.yml run --rm restaurar --type=time --target="2026-10-15 13:00:00+00" --target-action=promote
  restaurar:
    image: vida-publica-postgres
    profiles: [tools]
    user: postgres
    entrypoint: ["pgbackrest", "restore", "--delta", "--log-level-console=info"]
    environment:
      <<: *pgbackrest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    depends_on:
      backup-s3:
        condition: service_started

  # Worker de coleta: roda um comando e termina. Exemplo:
  #   docker compose -f infra/docker-compose.yml run --rm worker check-storage
  worker:
    build:
      context: ../services/ingest
    profiles: [tools]
    environment:
      VP_S3_ENDPOINT: http://s3:9000
      VP_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-vp_s3}
      VP_S3_SECRET_KEY: ${S3_SECRET_KEY:?rode node infra/scripts/init-env.mjs}
      VP_DB_HOST: postgres
      VP_DB_PORT: 5432
      VP_DB_NAME: ${POSTGRES_DB:-vida_publica}
      VP_DB_USER: vp_ingest
      VP_DB_PASSWORD: ${VP_INGEST_DB_PASSWORD:?rode node infra/scripts/init-env.mjs}
      VP_CPF_HASH_KEY: ${VP_CPF_HASH_KEY:?rode node infra/scripts/init-env.mjs}
      VP_CAMARA_PRESENCA_LEGADO: ${VP_CAMARA_PRESENCA_LEGADO:-false}
      VP_LOG_JSON: ${VP_LOG_JSON:-false}
      VP_SENTRY_DSN: ${VP_SENTRY_DSN:-}
      VP_AMBIENTE: ${VP_AMBIENTE:-local}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy

  # Vigia de dados desatualizados: a cada 5 minutos confere o prazo de cada
  # fonte e do motor de eventos (raw.fonte_prazo × raw.job_run), abre e fecha
  # alertas (raw.alerta) e avisa: sempre no log (JSON); no Sentry e no
  # healthchecks.io (check "fontes") quando as credenciais estão no infra/.env.
  vigia:
    build:
      context: ../services/ingest
    restart: unless-stopped
    command: ["vigiar", "--continuo"]
    environment:
      VP_DB_HOST: postgres
      VP_DB_PORT: 5432
      VP_DB_NAME: ${POSTGRES_DB:-vida_publica}
      VP_DB_USER: vp_ingest
      VP_DB_PASSWORD: ${VP_INGEST_DB_PASSWORD:?rode node infra/scripts/init-env.mjs}
      VP_LOG_JSON: "true"
      VP_SENTRY_DSN: ${VP_SENTRY_DSN:-}
      VP_AMBIENTE: ${VP_AMBIENTE:-local}
      VP_HEALTHCHECKS_PING_KEY: ${VP_HEALTHCHECKS_PING_KEY:-}
      VP_VIGIA_INTERVALO_SEGUNDOS: ${VP_VIGIA_INTERVALO_SEGUNDOS:-300}
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/vigia-vivo -mmin -15 2>/dev/null)\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # Migrações do banco (db/migrations). Rodar com:
  #   docker compose -f infra/docker-compose.yml run --rm migrate
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vp_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vida_publica}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ../db:/db:ro
    command: ["--wait", "up"]

volumes:
  postgres-data:
  postgres-socket:
  postgres-restauracao:
  s3-data:
